[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
files = ["."]
ignore_missing_imports = true
python_version = "3.10"
show_error_codes = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-ra --cov=. --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
